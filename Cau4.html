<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý công nhân</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h2>Danh sách công nhân</h2>
    <button onclick="showWorker()">Hiển thị danh sách</button>
    <table id="workerTable">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Ngày sinh</th>
          <th>Địa chỉ</th>
          <th>Lương</th>
          <th>Chức vụ</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      //Định nghĩa lớp công nhân
      class Worker {
        constructor(stt, name, dob, address, salary, position) {
          this.stt = stt;
          this.name = name;
          this.dob = dob;
          this.address = address;
          this.salary = salary;
          this.position = position;
        }
      }
      //Tạo danh sách công nhân mẫu

      const workers = [
        new Worker(
          1,
          "Nguyễn Văn A",
          "01/01/1990",
          "Hải Phòng",
          8000000,
          "Thợ chính",
        ),
        new Worker(2, "Trần Thị B", "12/05/2001", "Hà Nội", 6500000, "Thợ phụ"),
        new Worker(3, "Lê Văn C", "20/07/1994", "Đà Nẵng", 9750000, "Quản lý"),
        new Worker(
          4,
          "Nguyễn Phú Dương",
          "14/10/2003",
          "Hải Phòng",
          50000000,
          "Chủ tịch",
        ),
      ];
      //Hàm hiển thị danh sách công nhân
      function showWorker() {
        //Sắp xếp theo họ và tên
        workers.sort((a, b) => a.name.localeCompare(b.name));

        const tbody = document.querySelector("#workerTable tbody");
        tbody.innerHTML = "";

        workers.forEach((workers) => {
          const row = document.createElement("tr");
          row.innerHTML = `
         <td>${workers.stt}</td>
          <td>${workers.name}</td>
           <td>${workers.dob}</td>
            <td>${workers.address}</td>
             <td>${workers.salary}</td>
              <td>${workers.position}</td>
         `;
          tbody.appendChild(row);
        });
      }
    </script>
  </body>
</html>
